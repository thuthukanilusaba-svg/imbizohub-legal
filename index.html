<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ImbizoHub</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f6fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 44px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 30px;
    margin: 0 0 8px;
    color: #1a1a2e;
  }
  p.subtitle {
    color: #666;
    font-size: 15px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  a.button {
    display: block;
    width: 100%;
    padding: 13px;
    background: #5b5bf0;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  a.button.secondary {
    background: #fff;
    color: #5b5bf0;
    border: 1px solid #d8d8e0;
  }
  .links {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    font-size: 13px;
    color: #999;
  }
  .links a {
    color: #999;
    text-decoration: none;
    margin: 0 8px;
  }
  .links a:hover {
    color: #5b5bf0;
  }
  .brand {
    font-weight: 700;
    color: #5b5bf0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="brand">ImbizoHub</span></h1>
    <p class="subtitle">Buy and sell with confidence. Chat, meet, and pay — all backed by verified handovers and real ratings.</p>

    <!-- Once your Play Store listing is live, update this link -->
    <a class="button" href="#">Get it on Google Play</a>

    <div class="links">
      <a href="privacy-policy.html">Privacy Policy</a>
      ·
      <a href="delete-account.html">Delete Account</a>
    </div>
  </div>
</body>
</html>
