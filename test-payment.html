<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Complete — ImbizoHub</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #1A1A18;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 40px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .emoji { font-size: 56px; margin-bottom: 16px; }
  h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 12px;
  }
  p {
    color: #AAAAAA;
    font-size: 14px;
    line-height: 20px;
    margin: 0 0 8px;
  }
  .badge {
    display: inline-block;
    margin-top: 20px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #2a2a2a;
    color: #B8860B;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">✅</div>
    <h1>Test payment complete</h1>
    <p>This confirms a test-mode payment on ImbizoHub. No real money was charged.</p>
    <p>You can close this tab and return to the app.</p>
    <span class="badge">TEST MODE</span>
  </div>
</body>
</html>
