<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Your Password — ImbizoHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f6fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 36px 32px;
    max-width: 400px;
    width: 100%;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
    color: #1a1a2e;
  }
  p.subtitle {
    color: #666;
    font-size: 14px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d8d8e0;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
  }
  input[type="password"]:focus {
    border-color: #5b5bf0;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #5b5bf0;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .message {
    margin-top: 16px;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .message.error {
    background: #fdeaea;
    color: #a12727;
    display: block;
  }
  .message.success {
    background: #e8f7ee;
    color: #1e7a41;
    display: block;
  }
  .brand {
    font-weight: 700;
    color: #5b5bf0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="subtitle"><span class="brand">ImbizoHub</span> — enter a new password for your account.</p>

    <form id="reset-form">
      <label for="password">New password</label>
      <input type="password" id="password" minlength="6" required placeholder="At least 6 characters" />

      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" minlength="6" required placeholder="Re-enter password" />

      <button type="submit" id="submit-btn">Update Password</button>
    </form>

    <div id="message" class="message"></div>
  </div>

<script>
  const SUPABASE_URL = "https://goughfxpcwxwsfthlmii.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Ei3jc2GIs9rNKfLkJRjWyg_mvGZrvet";

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("reset-form");
  const messageEl = document.getElementById("message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "message " + type;
  }

  // Supabase puts the recovery token in the URL hash, e.g.
  // #access_token=...&type=recovery
  // The JS client picks this up automatically on load when detectSessionInUrl is enabled (default),
  // so we just listen for the PASSWORD_RECOVERY event / or check the session.

  let sessionReady = false;

  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      sessionReady = true;
    }
  });

  // Fallback: also check current session shortly after load,
  // in case the event already fired before our listener attached.
  window.addEventListener("load", async () => {
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      sessionReady = true;
    }

    // If there's an error in the URL (e.g. otp_expired), show it clearly.
    const hash = window.location.hash;
    if (hash.includes("error=")) {
      const params = new URLSearchParams(hash.substring(1));
      const desc = params.get("error_description") || "This reset link is invalid or has expired.";
      showMessage(decodeURIComponent(desc.replace(/\+/g, " ")), "error");
      form.style.display = "none";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (password.length < 6) {
      showMessage("Password must be at least 6 characters.", "error");
      return;
    }

    if (password !== confirm) {
      showMessage("Passwords do not match.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Updating...";

    const { error } = await sb.auth.updateUser({ password });

    if (error) {
      showMessage(error.message || "Something went wrong. Please request a new reset link.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Update Password";
    } else {
      showMessage("Password updated! You can now log in with your new password in the ImbizoHub app.", "success");
      form.style.display = "none";
    }
  });
</script>
</body>
</html>
